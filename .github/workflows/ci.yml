name: CI

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build_test:
    uses: membraneframework/membrane_actions/.github/workflows/build-test.yml@main

  lint:
    uses: membraneframework/membrane_actions/.github/workflows/lint.yml@main

  test:
    uses: membraneframework/membrane_actions/.github/workflows/test.yml@main
    with:
      setup-commands: |
        VERSION=0.14.12
        curl -fsSL "https://github.com/kixelated/moq/releases/download/moq-relay-v${VERSION}/moq-relay-${VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
          | tar -xz --strip-components=2 -C /usr/local/bin "moq-relay-${VERSION}-x86_64-unknown-linux-gnu/bin/moq-relay"
